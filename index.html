<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="甜薄荷">
    <meta name="theme-color" content="#FDFCFA">
    <link rel="manifest" href="manifest.json">
    <title>甜薄荷</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16/dist/contrib/auto-render.min.js"></script>
</head>
<body>
    <div class="app">
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <aside class="sidebar hidden" id="sidebar">
            <div class="sidebar-header">
                <button class="btn-icon" id="sidebarOpenSettings" title="设置" onclick="closeSidebar();openSettingsPanel()"><i data-lucide="settings"></i></button>
                <input type="file" id="userAvatarInput" accept="image/*" hidden>
            </div>

            <div class="sidebar-folder-section" id="sidebarFolderSection">
                <div class="sidebar-folder-toggle" id="sidebarFolderToggle">
                    <span class="sidebar-folder-label">文件夹</span>
                    <i data-lucide="chevron-down" class="sidebar-folder-chevron"></i>
                </div>
                <div class="sidebar-folder-body" id="sidebarFolderBody" style="display:none;">
                    <button class="sidebar-new-folder-btn" id="newFolderBtn"><i data-lucide="folder-plus"></i>新建文件夹</button>
                </div>
            </div>

            <div class="chat-list" id="chatList"></div>
            <div class="sidebar-footer">
                <div class="sidebar-search">
                    <i data-lucide="search" class="sidebar-search-icon"></i>
                    <input type="text" id="chatSearchInput" class="sidebar-search-input" placeholder="搜索对话...">
                    <button class="sidebar-search-clear" id="chatSearchClear" title="清除" style="display:none;"><i data-lucide="x"></i></button>
                </div>
                <button class="nav-icon-btn nav-icon-btn-home" id="sidebarBackToHome" title="客厅"><i data-lucide="home"></i></button>
            </div>
        </aside>

        <!-- ===== 小家首页 ===== -->
        <div class="home-page active" id="homePage">
            <div class="room-title-en">Living Room</div>
            <div class="home-hero">
                <button class="btn-icon home-settings-btn" id="homeOpenChat" onclick="showPage('chat')"><i data-lucide="message-circle"></i></button>
            </div>
            <div class="home-content">
                <div class="home-duo">
                    <div class="glass-card cal-card" id="homeGreeting">
                        <div class="cal-header">
                            <button class="cal-nav" id="calPrev" aria-label="上个月">‹</button>
                            <div class="cal-title" id="calTitle">2026 · 7</div>
                            <button class="cal-nav" id="calNext" aria-label="下个月">›</button>
                        </div>
                        <div class="cal-weekdays"><span>MON</span><span>TUE</span><span>WED</span><span>THU</span><span>FRI</span><span>SAT</span><span>SUN</span></div>
                        <div class="cal-grid" id="calGrid"></div>
                    </div>
                    <div class="glass-card weather-card" id="weatherCard">
                        <div class="weather-head">Today</div>
                        <div class="weather-body" id="weatherBody">
                            <div class="weather-empty">未配置天气<br><span>设置 → 天气配置</span></div>
                        </div>
                        <div class="weather-note" id="weatherNote"></div>
                    </div>
                </div>

                <div class="home-actions">
                    <button class="home-action" onclick="openRoom('echoHome')">
                        <span class="home-action-icon">🛋️</span>
                        <span class="home-action-name">沙发</span>
                        <span class="home-action-desc">回声</span>
                    </button>
                    <button class="home-action" onclick="openRoom('fishtankHome')">
                        <span class="home-action-icon">🐠</span>
                        <span class="home-action-name">鱼缸</span>
                        <span class="home-action-desc">生活轨迹</span>
                    </button>
                    <button class="home-action" onclick="alert('音响开发中，敬请期待～')">
                        <span class="home-action-icon">🔊</span>
                        <span class="home-action-name">音响</span>
                        <span class="home-action-desc">敬请期待</span>
                    </button>
                    <button class="home-action" onclick="alert('游戏开发中，敬请期待～')">
                        <span class="home-action-icon">🎮</span>
                        <span class="home-action-name">游戏</span>
                        <span class="home-action-desc">敬请期待</span>
                    </button>
                </div>
            </div>
        </div>


        <main class="chat-main" id="chatMain" style="display:none;">
                        <header class="chat-header">
                <div class="chat-header-capsule chat-header-capsule-left">
                    <button class="chat-header-menu" id="openSidebar" title="侧边栏"><i data-lucide="menu"></i></button>
                </div>
                <div class="chat-header-capsule chat-header-capsule-right">
                    <button class="chat-header-btn" id="headerNewChat" title="新建对话"><i data-lucide="message-circle-plus"></i></button>
                    <button class="chat-header-btn" id="headerMoreBtn" title="更多"><i data-lucide="more-vertical"></i></button>
                </div>
            </header>

            <div class="messages" id="messages"></div>

            <div class="input-area">
                    <input type="file" id="fileInputHidden" accept=".txt,.md,.json,.csv,.js,.ts,.py,.html,.css,.xml,.yaml,.yml,.log,text/*,application/json,application/pdf" hidden>
                    <input type="file" id="cameraInputHidden" accept="image/*" capture="environment" hidden>
                    <input type="file" id="imageInputHidden" accept="image/*" hidden>

                <div class="input-pill-bar" id="inputPillBar">
                    <button class="input-pill" id="pillPhoto" title="照片（长按拍摄）">照片</button>
                    <button class="input-pill" id="pillFile" title="文件">文件</button>
                    <button class="input-pill" id="pillCompress" title="压缩历史">压缩</button>
                    <button class="input-pill" id="pillModel" title="模型选择">模型</button>
                    <button class="input-pill" id="pillSearch" title="搜索配置">搜索</button>
                    <button class="input-pill" id="pillMcp" title="MCP 配置">MCP</button>
                    <button class="input-pill" id="pillStar" title="收藏">收藏</button>
                </div>

                <div class="input-pill-wrap">
                    <!-- Sticker popup -->
                    <div class="input-popup sticker-popup" id="stickerPopup">
                        <div class="sticker-panel active" id="stickerPanel"></div>
                    </div>

                    <div class="input-pill-row">
                        <button class="input-pill-btn" id="voiceBtn" title="语音输入"><i data-lucide="mic"></i></button>
                        <div class="input-pill-field">
                            <textarea id="messageInput" placeholder="和ta说点什么..." rows="1"></textarea>
                            <button class="input-pill-expand" id="expandInput" title="全屏输入"><i data-lucide="maximize-2"></i></button>
                        </div>
                        <button class="input-pill-btn" id="stickerBtn" title="表情"><i data-lucide="smile"></i></button>
                        <button class="input-pill-send" id="sendBtn" disabled><i data-lucide="corner-right-up"></i></button>
                    </div>
                </div>
            </div>

            <div class="fullscreen-input-overlay" id="fullscreenInput">
                <div class="fullscreen-input-header">
                    <h3>编辑消息</h3>
                    <button class="btn-icon" id="closeFullscreen"><i data-lucide="chevron-down"></i></button>
                </div>
                <textarea class="fullscreen-textarea" id="fullscreenTextarea" placeholder="在这里输入更多内容..."></textarea>
                <div class="fullscreen-input-footer">
                    <button class="btn-primary" id="fullscreenSend">发送</button>
                </div>
            </div>
        </main>

        <div class="settings-overlay" id="settingsOverlay">
            <div class="settings-panel">
                <div class="settings-header">
                    <div class="settings-header-left">
                        <button class="btn-icon settings-back-btn" id="settingsBackBtn" style="display:none;"><i data-lucide="arrow-left"></i></button>
                        <h2 id="settingsTitle">设置</h2>
                    </div>
                    <div class="settings-header-right">
                        <button class="btn-icon settings-refresh-btn" id="refreshMcpBtn" style="display:none;" title="刷新 MCP 连接"><i data-lucide="refresh-cw"></i></button>
                        <button class="btn-icon settings-save-btn" id="closeSettings"><i data-lucide="check"></i></button>
                    </div>
                </div>
                <div class="settings-content" id="settingsContent"></div>
                <div class="settings-footer" id="settingsFooter"></div>
            </div>
        </div>

        <div class="edit-title-overlay" id="editTitleOverlay">
            <div class="edit-title-panel">
                <h3>编辑对话标题</h3>
                <input type="text" id="editTitleInput" placeholder="输入对话标题">
                <div class="edit-title-actions">
                    <button class="btn-cancel" id="editTitleCancel">取消</button>
                    <button class="btn-primary" id="editTitleSave">保存</button>
                </div>
            </div>
        </div>

        <div class="chat-more-overlay" id="chatMoreOverlay">
            <div class="chat-more-panel">
                <button class="chat-more-option" id="chatMoreRename"><i data-lucide="pencil"></i><span>重命名</span></button>
                <button class="chat-more-option" id="chatMorePin"><i data-lucide="arrow-up-from-line"></i><span>置顶</span></button>
                <button class="chat-more-option chat-more-option-danger" id="chatMoreDelete"><i data-lucide="trash-2"></i><span>删除</span></button>
            </div>
        </div>

        <div class="add-key-overlay" id="addKeyOverlay">
            <div class="add-key-panel">
                <h3>添加 API 密钥</h3>
                <div class="form-group"><input type="text" id="newKeyName" placeholder="名称（例如：工作区）"></div>
                <div class="form-group"><input type="text" id="newKeyValue" placeholder="API Key"></div>
                <div class="form-group"><input type="text" id="newKeyUrl" placeholder="API URL（例如：https://api.example.com/v1）"></div>
                <div class="add-key-actions">
                    <button class="add-key-cancel" id="addKeyCancelBtn">取消</button>
                    <button class="btn-primary" id="addKeySaveBtn">添加</button>
                </div>
            </div>
        </div>

        <div class="edit-user-overlay" id="editUserOverlay">
            <div class="edit-user-panel">
                <div class="edit-user-header">
                    <h3>编辑个人信息</h3>
                    <button class="btn-icon" id="closeEditUser"><i data-lucide="x"></i></button>
                </div>
                <div class="edit-user-content">
                    <div class="form-group" style="text-align:center;">
                        <div class="edit-user-avatar" id="editUserAvatar"><i data-lucide="moon"></i></div>
                        <div><button class="btn-secondary" id="changeUserAvatarBtn" style="margin-top:10px;font-size:12px;">更换头像</button></div>
                    </div>
                    <div class="form-group">
                        <label>用户名</label>
                        <input type="text" id="editUserNameInput" placeholder="输入用户名">
                    </div>
                </div>
                <div class="edit-user-footer">
                    <button class="btn-primary" id="saveEditUser">保存</button>
                </div>
            </div>
        </div>

        <div class="stats-overlay" id="statsOverlay">
            <div class="stats-panel">
                <div class="stats-header">
                    <button class="stats-back" id="closeStats"><i data-lucide="chevron-left"></i></button>
                    <h2>统计</h2>
                </div>
                <div class="stats-content" id="statsContent"></div>
            </div>
        </div>

        <div class="stats-overlay" id="bedroomOverlay">
            <div class="stats-panel">
                <div class="stats-header">
                    <button class="stats-back" id="bedroomBack"><i data-lucide="chevron-left"></i></button>
                    <h2 id="bedroomTitle">卧室</h2>
                    <button class="stats-back bedroom-extra-btn" id="bedroomExtraBtn" style="display:none;"><i data-lucide="plus"></i></button>
                </div>
                <div class="stats-content" id="bedroomContent"></div>
            </div>
        </div>
        <!-- ===== 底部房间 Tab 栏 ===== -->
        <nav class="room-tabbar" id="roomTabBar" aria-label="房间导航">
            <input type="radio" name="roomTab" class="room-tab-input" id="roomTabStudy">
            <label class="room-tab" for="roomTabStudy" onclick="openRoom('studyHome')">
                <span class="room-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>
                <span class="room-tab-name">书房</span>
            </label>
            <input type="radio" name="roomTab" class="room-tab-input" id="roomTabKitchen">
            <label class="room-tab" for="roomTabKitchen" onclick="openRoom('kitchenHome')">
                <span class="room-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 21h10"/><path d="M12 21a9 9 0 0 0 9-9H3a9 9 0 0 0 9 9Z"/><path d="M11.38 12a2.4 2.4 0 0 1-.4-4.77 2.4 2.4 0 0 1 3.2-2.77 2.4 2.4 0 0 1 3.47-.63 2.4 2.4 0 0 1 3.37 3.37 2.4 2.4 0 0 1-1.1 3.7 2.51 2.51 0 0 1 .03 1.1"/><path d="m13 12 4-4"/><path d="M10.9 7.25A3.99 3.99 0 0 0 4 10c0 .73.2 1.41.54 2"/></svg></span>
                <span class="room-tab-name">厨房</span>
            </label>
            <input type="radio" name="roomTab" class="room-tab-input" id="roomTabLiving" checked>
            <label class="room-tab room-tab-heart" for="roomTabLiving" onclick="showHomeFromTab()">
                <span class="room-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg></span>
                <span class="room-tab-name">客厅</span>
            </label>
            <input type="radio" name="roomTab" class="room-tab-input" id="roomTabBedroom">
            <label class="room-tab" for="roomTabBedroom" onclick="openRoom('bedroomHome')">
                <span class="room-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></span>
                <span class="room-tab-name">卧室</span>
            </label>
            <input type="radio" name="roomTab" class="room-tab-input" id="roomTabGarden">
            <label class="room-tab" for="roomTabGarden" onclick="openRoom('gardenHome')">
                <span class="room-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg></span>
                <span class="room-tab-name">花园</span>
            </label>
        </nav>
    </div>


<div class="info-sheet-backdrop" id="infoSheetBackdrop"></div>
<div class="info-sheet" id="infoSheet">
    <div class="info-sheet-handle" id="infoSheetHandle"></div>
    <div class="info-sheet-header">
        <span class="info-sheet-title" id="infoSheetTitle"></span>
        <button class="info-sheet-close" id="infoSheetClose" aria-label="关闭"><i data-lucide="x"></i></button>
    </div>
    <div class="info-sheet-content" id="infoSheetContent"></div>
</div>

    <link rel="stylesheet" href="piggy-bank.css">
    <link rel="stylesheet" href="tool-system.css">
    <link rel="stylesheet" href="diary-page.css">
    <script src="diary-page.js"></script>
    <script src="tool-system.js"></script>
    <script src="mcp-client.js"></script>
    <script src="app.js"></script>
    <script src="piggy-bank.js"></script>
    <script src="sidebar.js"></script>
    <script src="study.js"></script>
    <script>
        lucide.createIcons();
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW register failed:', err));
            });
        }
    </script>

</body>
</html>
